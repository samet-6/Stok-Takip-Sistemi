# StokTakip — tam yığın orkestrasyonu.
# Tüm parola/anahtar değerleri DEMO'dur; gerçek ortamda Docker secret / env_file
# ile yönetilir, repoya girmez. Bkz. README dağıtım notları.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: stoktakip
      POSTGRES_USER: stok               # demo — gerçek ortamda secret yönetimi gerekir
      POSTGRES_PASSWORD: stok_demo_pw   # demo — gerçek ortamda secret yönetimi gerekir
      # postgres:18 imajı PGDATA'yı /var/lib/postgresql/18/docker'a taşıdı; klasik
      # düzeni geri getirip named volume'ü doğru dizine bağlıyoruz (kalıcılık kanıtı).
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5433:5432"                     # host 5433 (lokal PG 5432 dolu); container içi 5432 KALIR
    volumes:
      - stok_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stok -d stoktakip"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/StokTakip.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # TUZAK: Port=5432 — 5433 yalnız host tarafı; container ağında postgres:5432.
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=stoktakip;Username=stok;Password=stok_demo_pw"  # demo
      Jwt__Issuer: StokTakip
      Jwt__Audience: StokTakip
      Jwt__ExpiryHours: "8"
      Jwt__Key: "compose-demo-jwt-key-please-change-in-production-0123456789"  # demo (32+) — gerçek ortamda secret yönetimi gerekir
      Seed__AdminPassword: "Admin123!"  # demo — README'de yayınlanır; gerçek ortamda secret yönetimi gerekir
      Seed__UserPassword: "User123!"    # demo — gerçek ortamda secret yönetimi gerekir
    depends_on:
      postgres:
        condition: service_healthy
    # Host'a port açılmaz — yalnız iç ağdan (web → api:8080) erişilir.

  web:
    build: ./web
    ports:
      - "3000:80"
    depends_on:
      - api
    # nginx:alpine has busybox wget; no extra package needed. The e2e service waits on
    # this instead of racing the container's startup.
    # 127.0.0.1, NOT localhost: inside the image `localhost` resolves to ::1 only, while
    # nginx.conf says `listen 80;` (IPv4). Measured: wget to localhost gets "Connection
    # refused", to 127.0.0.1 it succeeds — the container-side twin of the Vite note in CLAUDE.md.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Uçtan uca testler. Normal `docker compose up` bunu BAŞLATMAZ — profile ile istenir:
  #   docker compose --profile e2e up --build --abort-on-container-exit --exit-code-from e2e
  # Testleri konteyner içinde koşturmanın sebebi: çalıştıran kişinin makinesinde Node,
  # npm ya da tarayıcı indirmesi gerekmesin.
  e2e:
    profiles: ["e2e"]
    build: ./e2e
    environment:
      # Konteyner ağında web nginx'i 80'de dinliyor; 3000 yalnız host tarafındaki eşleme.
      E2E_BASE_URL: http://web
      CI: "true"
    depends_on:
      web:
        condition: service_healthy
    volumes:
      # Rapor ve hata kanıtları (trace/ekran görüntüsü) host'ta kalsın.
      - ./e2e/playwright-report:/e2e/playwright-report
      - ./e2e/test-results:/e2e/test-results

volumes:
  stok_pgdata:
