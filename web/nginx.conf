# Included from the http{} block of the base image config, so a map directive is legal
# here. Echoes "upgrade" back when the client asked for one and "close" otherwise —
# hardcoding Connection: upgrade would break SignalR's plain-HTTP transport fallbacks.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # SPA fallback: deep links like /urunler/5 must resolve to index.html, not 404.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the api container (same-origin, so no CORS in prod).
    location /api {
        proxy_pass http://api:8080;
        # nginx resolves "api" once at startup and keeps the address, so while the api
        # container is down it connects to an IP nothing answers on. The SYN is dropped
        # rather than refused, and the default 60s connect timeout then leaves the browser
        # hanging instead of failing: measured 45s+ on the first request. Connecting over
        # the bridge takes under a millisecond when the container is up, so 2s is pure
        # headroom and makes an outage look like an error instead of a freeze.
        proxy_connect_timeout 2s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR hub. A separate location from /api on purpose: the long read timeout and
    # disabled buffering a live connection needs must not apply to REST, where a stuck
    # request should die in the default 60s instead of holding nginx open for an hour.
    location /hubs {
        proxy_pass http://api:8080;
        # Same dead-upstream case as /api above. The long read timeout below is for a
        # live connection; reaching the upstream in the first place must still fail fast.
        proxy_connect_timeout 2s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
